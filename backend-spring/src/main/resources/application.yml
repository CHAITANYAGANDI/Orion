server:
  port: 8080

spring:
  application:
    name: orion-backend-spring

  # Runtime connections use the UNPRIVILEGED role. Row-level security is
  # ignored by superusers and by anything holding BYPASSRLS, so connecting as
  # the schema owner would leave every V9 policy enabled and enforcing nothing.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orion}
    username: ${SPRING_DATASOURCE_USERNAME:orion_app}
    password: ${SPRING_DATASOURCE_PASSWORD:orion_app}
    driver-class-name: org.postgresql.Driver

  # How much scheduled work can happen at once.
  #
  # Boot's default is a single thread, which was fine when the only jobs were
  # the relay's one-second tick and a nightly retention pass. It is not fine
  # now: a tick that finds Kafka unreachable can sit inside a send for as long
  # as the producer's delivery timeout, and on one thread every other scheduled
  # job waits behind it -- so a broker outage would quietly postpone the pass
  # that applies each account's data-retention policy.
  #
  # Three threads for three jobs: the relay, the retention pass, the outbox
  # purge. They have no reason to overlap, but none of them should be able to
  # hold the others up either.
  #
  # This does not weaken the outbox. A @Scheduled method with a fixed delay is
  # never run concurrently with itself however large the pool is, and the row
  # ownership boundary was never the thread in the first place -- it is
  # FOR UPDATE SKIP LOCKED, which already holds across separate machines and so
  # holds across threads for free.
  task:
    scheduling:
      pool:
        size: ${ORION_SCHEDULER_THREADS:3}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  # Migrations run as the schema OWNER, which the runtime role deliberately is
  # not: the app can read and write rows but cannot alter a table or drop a
  # policy to escape its own tenant.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Defaults to the runtime URL, which is right locally where both point at
    # the same server. Against a managed Postgres they must differ: Flyway
    # holds an advisory lock across several transactions, and a transaction-mode
    # connection pooler does not keep it — so FLYWAY_URL should name the direct
    # endpoint while the runtime pool uses the pooled one.
    url: ${FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orion}}
    user: ${FLYWAY_USER:orion}
    password: ${FLYWAY_PASSWORD:orion}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Local Kafka listens without auth, so the default protocol is PLAINTEXT and
    # the SASL settings below are inert — the client only reads them once the
    # protocol selects SASL. A managed broker (Confluent, Redpanda, Aiven) needs
    # KAFKA_SECURITY_PROTOCOL=SASL_SSL and a jaas config carrying the API key.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      group-id: orion-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # How long send() may block before the record has been handed to the
        # producer at all -- waiting for cluster metadata, or for buffer space.
        # Sixty seconds is the client default and it is why a completely
        # unreachable broker costs the relay a full minute per attempt.
        #
        # Ten is the right number here and the reason is specific: a timeout at
        # THIS stage cannot produce a duplicate. Nothing has been transmitted --
        # the record was never appended to a batch -- so giving up early costs
        # one retry from a durable backoff and nothing else.
        #
        # Deliberately NOT the same reasoning as delivery.timeout.ms, which is
        # left at its 120s default. That clock covers a record already in flight,
        # and a record that times out there may well have reached the broker
        # anyway; cutting it short would turn slow-but-working into a second
        # publication, and a second publication of meeting_uploaded is a second
        # transcription somebody pays for. Waiting two minutes is cheaper than
        # that, so the wait stays. acks=all, enable.idempotence=true,
        # retries=MAX_VALUE and request.timeout.ms=30s are all left at the
        # client defaults, which are already the safe end of every trade-off.
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:10000}
    listener:
      missing-topics-fatal: false

# NOTE: deliberately no `spring.security.oauth2.resourceserver.*` here.
# Boot's OAuth2 resource-server autoconfiguration activates as soon as
# jwk-set-uri is *present* — an empty value (dev mode) makes it fail startup
# with "jwkSetUri cannot be empty". AuthenticationFilter builds the Clerk
# JwtDecoder itself, lazily, from orion.clerk.jwks-url below.

orion:
  # Defaults to clerk, and that single word is the whole of the access control
  # story for a deployment whose environment did not arrive intact.
  #
  # This used to read `:dev`, which quietly cancelled the fail-closed default
  # written on the @Value in AuthenticationFilter and ClerkTokens. A @Value
  # default only applies when the property is ABSENT, and this file made it
  # present in every profile -- so an unset ORION_AUTH_MODE resolved here, to
  # dev, and the guard three layers down never got a say. Two defaults for one
  # decision, and the weaker one won.
  #
  # In dev mode AuthenticationFilter and StompAuthInterceptor take an
  # `X-Dev-User` header at its word and become whoever it names. A deployment
  # that missed this variable was completely open and behaved perfectly.
  #
  # The opposite mistake costs a wall of 401s: obvious in seconds, and nobody's
  # data is exposed while it lasts. See AuthModeDefaultTest.
  auth-mode: ${ORION_AUTH_MODE:clerk}
  # No default, deliberately. This is the shared secret on /internal/**, which
  # is where the ai-service writes transcripts and marks meetings READY -- so a
  # well-known default value is an unauthenticated write endpoint dressed as a
  # configured one. Blank means InternalTokenFilter refuses every internal
  # request rather than accepting a token published in this repository.
  internal-token: ${ORION_INTERNAL_TOKEN:}
  clerk:
    issuer: ${CLERK_ISSUER:}
    jwks-url: ${CLERK_JWKS_URL:}
  # The nightly pass that applies each account's retention policy. Written out
  # here rather than left to an inline default because it is the one scheduled
  # job that deletes data: an environment restored from a backup should be able
  # to find the switch before it wakes up and re-runs last month's deletions.
  retention:
    enabled: ${ORION_RETENTION_ENABLED:true}
    cron: ${ORION_RETENTION_CRON:0 0 3 * * *}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  # Where this API is reachable from the public internet. Distinct from the
  # frontend URL and only used for the calendar feed, which is fetched by
  # Google's and Apple's servers rather than by a browser on the user's network
  # — a localhost or docker-internal address works everywhere else and is dead
  # on arrival there.
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:orion}
  region: ${S3_REGION:us-east-1}
  presign-expiry-seconds: 900
  # Applied to the bucket at startup when set (AES256 or aws:kms), and left
  # alone when blank — which is what a deployment managing its own bucket
  # policy wants. Whatever the bucket actually reports afterwards is what the
  # privacy page shows; see StorageService.encryptionAtRest.
  default-encryption: ${S3_DEFAULT_ENCRYPTION:}
  kms-key-id: ${S3_KMS_KEY_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 500ms

logging:
  level:
    com.orion: INFO
