# Orion on Render — two Docker services against managed backing stores.
#
#   Postgres  Neon          (already provisioned)
#   Kafka     Confluent Cloud
#   Storage   Cloudflare R2
#
# The Next.js frontend is NOT here. It is deployed on Vercel, so this blueprint
# covers the backend and the AI worker only. The two places that used to assume
# otherwise are APP_FRONTEND_URL below -- which is now a Vercel origin rather
# than an onrender.com one -- and the NEXT_PUBLIC_* build args, which moved to
# Vercel's project settings along with the build that consumes them.
#
# Nothing secret lives in this file. Every value marked `sync: false` is left
# blank here and filled in the Render dashboard (or via an env group) so the
# blueprint stays committable. See docs/deploy.md for how each one is obtained
# and for the one-time database setup, which this file cannot do.
#
# Deliberately NOT declared here: `databases:`. Neon already holds the data, and
# declaring one would have Render provision a second, empty copy alongside it.
# There is no Redis at all any more -- the rate limiter it backed is in-process.
# That makes it per-instance: a second backend would allow twice the burst limit,
# which is the one thing scaling out still changes. The outbox is not: its relay
# claims rows with FOR UPDATE SKIP LOCKED, so every instance can run one.

services:
  # ---------------------------------------------------------------------------
  # Backend — the only service that talks to every backing store, and the only
  # one that runs migrations.
  # ---------------------------------------------------------------------------
  - type: web
    name: orion-backend
    runtime: docker
    plan: starter          # 512 MB is not enough; the JVM heap below assumes 2 GB
    dockerfilePath: ./backend-spring/Dockerfile
    dockerContext: ./backend-spring
    healthCheckPath: /actuator/health
    envVars:
      # --- Which mode this is ----------------------------------------------
      # Switches on DeploymentCheck, which refuses to start this service if any
      # of the settings below is still the development one. Set here and
      # nowhere else -- docker-compose deliberately does not, because the local
      # stack IS the development configuration and stopping it would be absurd.
      - key: SPRING_PROFILES_ACTIVE
        value: production

      # --- JVM -------------------------------------------------------------
      # Container-aware sizing. Without this the JVM sees the host's memory,
      # sizes a heap it cannot have, and is OOM-killed under load.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40

      # --- Postgres (Neon) --------------------------------------------------
      # Runtime traffic goes through the POOLED endpoint; migrations do not.
      # Flyway holds an advisory lock across several transactions and a
      # transaction-mode pooler will not keep it — so FLYWAY_URL must point at
      # the direct (non `-pooler`) host. docs/deploy.md spells this out.
      #
      # jdbc: form, and note `channel_binding` is a libpq parameter the JDBC
      # driver does not understand — strip it when converting the Neon URL.
      # The DIRECT host, not the pooled one. Row-level security is armed with a
      # session-level setting on each connection (TenantAwareDataSource), and a
      # transaction-mode pooler gives the next transaction a different server
      # connection -- so requests come back with no tenant, which reads as an
      # empty account rather than as an error. DeploymentCheck refuses to start
      # on a `-pooler` URL. Hikari is already the pool this process needs.
      - key: SPRING_DATASOURCE_URL
        sync: false        # jdbc:postgresql://<DIRECT-host>/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: orion_app
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ORION_DATASOURCE_SYSTEM_USERNAME
        value: orion_sys
      - key: ORION_DATASOURCE_SYSTEM_PASSWORD
        sync: false
      - key: FLYWAY_URL
        sync: false        # jdbc:postgresql://<DIRECT-host>/neondb?sslmode=require
      - key: FLYWAY_USER
        sync: false        # neondb_owner — the schema owner
      - key: FLYWAY_PASSWORD
        sync: false

      # --- Kafka (Confluent Cloud) ------------------------------------------
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false        # pkc-xxxxx.<region>.aws.confluent.cloud:9092
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: PLAIN
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false        # org.apache.kafka.common.security.plain.PlainLoginModule required username="KEY" password="SECRET";

      # --- Auth -------------------------------------------------------------
      # clerk, never dev. In dev mode an `X-Dev-User` header impersonates any
      # user, and nothing about a running deployment reveals the mistake.
      - key: ORION_AUTH_MODE
        value: clerk
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: ORION_INTERNAL_TOKEN
        generateValue: true   # must match the ai-service value; see docs/deploy.md

      # --- Storage (Cloudflare R2) ------------------------------------------
      # R2 is S3-compatible and the client already uses path-style addressing
      # with an endpoint override, so no code change is needed — only `auto`
      # as the region, which is what R2 expects.
      - key: S3_ENDPOINT
        sync: false        # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_PUBLIC_ENDPOINT
        sync: false        # same as S3_ENDPOINT unless a custom domain fronts the bucket
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: orion
      - key: S3_REGION
        value: auto

      # --- Wiring -----------------------------------------------------------
      # Left auto-wired, unlike the two public URLs. `hostport` yields
      # `orion-ai:10000` -- the right host and the right port, no scheme --
      # and AiClient prefixes `http://` because a private service on Render's
      # internal network can only mean that. Worth repairing rather than
      # refusing: the alternative is writing the private port out by hand and
      # keeping it in step forever.
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: orion-ai
          property: hostport
      # THE PUBLIC VERCEL FRONTEND ORIGIN -- e.g. https://orion.vercel.app, or
      # your custom domain once one is attached.
      #
      # This is the single allowed CORS origin AND the single allowed STOMP
      # origin, so a wrong value blocks every browser request and every socket
      # while the service itself stays perfectly healthy -- it reads as "the API
      # is down" rather than as a misconfiguration.
      #
      # `sync: false` because it cannot be derived. It once used `fromService`
      # pointing at a Render-hosted frontend; that service no longer exists here,
      # and Vercel is a different provider entirely, so nothing in this blueprint
      # knows the value. Fill it in the Render dashboard.
      #
      # Include the scheme. A bare host is not an origin -- CORS compares it
      # against the browser's `https://...` and never matches -- and no trailing
      # slash, because an Origin header never has one. DeploymentCheck refuses to
      # start if the scheme is missing.
      - key: APP_FRONTEND_URL
        sync: false        # https://<your-project>.vercel.app

      # Email. Off until both of the first two are set, and deliberately so:
      # a service that sends from a domain it does not own gets the domain
      # classified as spam, which fixing the setting afterwards does not undo.
      #
      # ORION_MAIL_FROM has to be on a domain verified in Resend. Seven
      # messages use these, five of them off per account until somebody turns
      # them on in Settings. See backend-spring/.../service/AccountMail.java.
      - key: RESEND_API_KEY
        sync: false
      - key: ORION_MAIL_FROM
        sync: false        # Recallix <notifications@yourdomain.com>

      # No domain yet? Resend will only send from onboarding@resend.dev, which
      # delivers to the Resend account owner and nobody else -- so there is no
      # honest way to pass the production check. Set this to declare that this
      # deployment has no users but you, and the check becomes a warning on
      # every boot instead of a refusal.
      #
      # Unset it the moment somebody else can sign up.
      - key: ORION_MAIL_SELF_ONLY
        sync: false        # true, only while you are the only account

      # Required whenever the above is true, and the reason it is enforceable
      # rather than a promise: every other Clerk subject is refused at
      # provisioning, so no account is created for it. Your Clerk user id --
      # it starts with `user_` and is on your user in the Clerk dashboard.
      - key: ORION_MAIL_SELF_USER_ID
        sync: false        # user_xxxxxxxxxxxxxxxxxxxxxxxxxx

      # Where this API is reachable from the public internet. Only used for the
      # calendar feed -- which is fetched by Google's and Apple's servers, not
      # by the user's browser, so this is the one URL where a private address
      # fails for somebody who is not you and cannot be noticed locally.
      #
      # Was absent from this file entirely, which meant it fell back to
      # http://localhost:8080 and every subscribed calendar silently stopped
      # updating.
      - key: APP_PUBLIC_URL
        sync: false        # https://orion-backend.onrender.com

  # ---------------------------------------------------------------------------
  # AI service — private. It is reached only by the backend and by Kafka, and
  # exposing it publicly would expose /internal-shaped surface for no reason.
  # ---------------------------------------------------------------------------
  - type: pserv
    name: orion-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    envVars:
      # Same missing-scheme problem as APP_FRONTEND_URL above: `property: host`
      # gives `orion-backend.onrender.com`, and httpx rejects a request URL
      # with no scheme -- so every transcript callback would fail after the work
      # was already done and paid for.
      - key: SPRING_CALLBACK_URL
        sync: false        # https://orion-backend.onrender.com
      - key: ORION_INTERNAL_TOKEN
        fromService:
          type: web
          name: orion-backend
          envVarKey: ORION_INTERNAL_TOKEN

      # --- Kafka ------------------------------------------------------------
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: PLAIN
      - key: KAFKA_SASL_USERNAME
        sync: false        # Confluent API key
      - key: KAFKA_SASL_PASSWORD
        sync: false        # Confluent API secret

      # --- Models -----------------------------------------------------------
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: OPENAI_CHAT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_EXTRACTION_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: TRANSCRIPTION_PROVIDER
        value: assemblyai
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_MODEL
        value: universal-3-5-pro
      - key: ASSEMBLYAI_FALLBACK_MODEL
        value: universal-2

      # --- Storage ----------------------------------------------------------
      - key: S3_ENDPOINT
        sync: false
      # Was missing here while the backend had it, so this service would have
      # run with it blank -- which does not fail, it silently takes the slow
      # path. Blank disables AssemblyAI fetching the recording from R2 itself,
      # so every file is downloaded into this container and uploaded again
      # instead of never touching it. Same value as S3_ENDPOINT unless a custom
      # domain fronts the bucket.
      - key: S3_PUBLIC_ENDPOINT
        sync: false        # https://<account-id>.r2.cloudflarestorage.com
      # These need WRITE as well as read. This service used to only ever read
      # from the bucket, so a token scoped to "Object Read only" worked; MP3
      # export writes the converted copy back, and a read-only token turns that
      # into a conversion that runs, succeeds, and fails on the last step every
      # single time. Use the same token as orion-backend.
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: orion
      - key: S3_REGION
        value: auto

      # --- Speaker identification -------------------------------------------
      # Optional, and OFF unless set: no voice template is computed and nothing
      # is stored. That is the correct default for a deployment that has not
      # decided where this key lives, because the alternative is encrypting
      # biometric-shaped data with a key committed to a public repository --
      # which is what docker-compose does on purpose for local development.
      #
      # Generate one with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      #
      # Rotating it does not re-encrypt anything; it orphans the old rows, which
      # are then ignored and recomputed.
      - key: SPEAKER_PROFILE_KEY
        sync: false        # optional -- speaker identification stays off without it

      # --- Postgres for RAG -------------------------------------------------
      # The unprivileged role, same as the backend's tenant pool: this service
      # must stay inside row-level security. Pooled endpoint is correct here —
      # it runs no migrations.
      - key: PG_HOST
        sync: false        # pooled Neon host
      - key: PG_PORT
        value: "5432"
      - key: PG_DATABASE
        value: neondb
      - key: PG_USER
        value: orion_app
      - key: PG_PASSWORD
        sync: false
      - key: PG_SSLMODE
        value: require
