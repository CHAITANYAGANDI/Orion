# Orion on Render — three Docker services against managed backing stores.
#
#   Postgres  Neon          (already provisioned)
#   Kafka     Confluent Cloud
#   Storage   Cloudflare R2
#
# Nothing secret lives in this file. Every value marked `sync: false` is left
# blank here and filled in the Render dashboard (or via an env group) so the
# blueprint stays committable. See docs/deploy.md for how each one is obtained
# and for the one-time database setup, which this file cannot do.
#
# Deliberately NOT declared here: `databases:`. Neon already holds the data, and
# declaring one would have Render provision a second, empty copy alongside it.
# There is no Redis at all any more -- the rate limiter it backed is in-process.
# That makes it per-instance: a second backend would allow twice the burst limit,
# which is the one thing scaling out still changes. The outbox is not: its relay
# claims rows with FOR UPDATE SKIP LOCKED, so every instance can run one.

services:
  # ---------------------------------------------------------------------------
  # Backend — the only service that talks to every backing store, and the only
  # one that runs migrations.
  # ---------------------------------------------------------------------------
  - type: web
    name: orion-backend
    runtime: docker
    plan: starter          # 512 MB is not enough; the JVM heap below assumes 2 GB
    dockerfilePath: ./backend-spring/Dockerfile
    dockerContext: ./backend-spring
    healthCheckPath: /actuator/health
    envVars:
      # --- Which mode this is ----------------------------------------------
      # Switches on DeploymentCheck, which refuses to start this service if any
      # of the settings below is still the development one. Set here and
      # nowhere else -- docker-compose deliberately does not, because the local
      # stack IS the development configuration and stopping it would be absurd.
      - key: SPRING_PROFILES_ACTIVE
        value: production

      # --- JVM -------------------------------------------------------------
      # Container-aware sizing. Without this the JVM sees the host's memory,
      # sizes a heap it cannot have, and is OOM-killed under load.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40

      # --- Postgres (Neon) --------------------------------------------------
      # Runtime traffic goes through the POOLED endpoint; migrations do not.
      # Flyway holds an advisory lock across several transactions and a
      # transaction-mode pooler will not keep it — so FLYWAY_URL must point at
      # the direct (non `-pooler`) host. docs/deploy.md spells this out.
      #
      # jdbc: form, and note `channel_binding` is a libpq parameter the JDBC
      # driver does not understand — strip it when converting the Neon URL.
      - key: SPRING_DATASOURCE_URL
        sync: false        # jdbc:postgresql://<pooled-host>/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: orion_app
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ORION_DATASOURCE_SYSTEM_USERNAME
        value: orion_sys
      - key: ORION_DATASOURCE_SYSTEM_PASSWORD
        sync: false
      - key: FLYWAY_URL
        sync: false        # jdbc:postgresql://<DIRECT-host>/neondb?sslmode=require
      - key: FLYWAY_USER
        sync: false        # neondb_owner — the schema owner
      - key: FLYWAY_PASSWORD
        sync: false

      # --- Kafka (Confluent Cloud) ------------------------------------------
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false        # pkc-xxxxx.<region>.aws.confluent.cloud:9092
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: PLAIN
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false        # org.apache.kafka.common.security.plain.PlainLoginModule required username="KEY" password="SECRET";

      # --- Auth -------------------------------------------------------------
      # clerk, never dev. In dev mode an `X-Dev-User` header impersonates any
      # user, and nothing about a running deployment reveals the mistake.
      - key: ORION_AUTH_MODE
        value: clerk
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: ORION_INTERNAL_TOKEN
        generateValue: true   # must match the ai-service value; see docs/deploy.md

      # --- Storage (Cloudflare R2) ------------------------------------------
      # R2 is S3-compatible and the client already uses path-style addressing
      # with an endpoint override, so no code change is needed — only `auto`
      # as the region, which is what R2 expects.
      - key: S3_ENDPOINT
        sync: false        # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_PUBLIC_ENDPOINT
        sync: false        # same as S3_ENDPOINT unless a custom domain fronts the bucket
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: orion
      - key: S3_REGION
        value: auto

      # --- Wiring -----------------------------------------------------------
      # Left auto-wired, unlike the two public URLs. `hostport` yields
      # `orion-ai:10000` -- the right host and the right port, no scheme --
      # and AiClient prefixes `http://` because a private service on Render's
      # internal network can only mean that. Worth repairing rather than
      # refusing: the alternative is writing the private port out by hand and
      # keeping it in step forever.
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: orion-ai
          property: hostport
      # The single allowed CORS origin AND the STOMP allowed origin, so a
      # wrong value here blocks every browser request and every socket while
      # the service itself stays perfectly healthy -- it reads as "the API is
      # down".
      #
      # NOT `fromService`, which is what this used to be. `property: host`
      # yields a bare `orion-frontend.onrender.com` with no scheme, and a
      # bare host is not an origin: CORS compares it against the browser's
      # `https://orion-frontend.onrender.com` and never matches. The
      # blueprint has no property that produces a URL, so this is filled in by
      # hand and DeploymentCheck refuses to start if it is missing a scheme.
      - key: APP_FRONTEND_URL
        sync: false        # https://orion-frontend.onrender.com

      # Where this API is reachable from the public internet. Only used for the
      # calendar feed -- which is fetched by Google's and Apple's servers, not
      # by the user's browser, so this is the one URL where a private address
      # fails for somebody who is not you and cannot be noticed locally.
      #
      # Was absent from this file entirely, which meant it fell back to
      # http://localhost:8080 and every subscribed calendar silently stopped
      # updating.
      - key: APP_PUBLIC_URL
        sync: false        # https://orion-backend.onrender.com

  # ---------------------------------------------------------------------------
  # AI service — private. It is reached only by the backend and by Kafka, and
  # exposing it publicly would expose /internal-shaped surface for no reason.
  # ---------------------------------------------------------------------------
  - type: pserv
    name: orion-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    envVars:
      # Same missing-scheme problem as APP_FRONTEND_URL above: `property: host`
      # gives `orion-backend.onrender.com`, and httpx rejects a request URL
      # with no scheme -- so every transcript callback would fail after the work
      # was already done and paid for.
      - key: SPRING_CALLBACK_URL
        sync: false        # https://orion-backend.onrender.com
      - key: ORION_INTERNAL_TOKEN
        fromService:
          type: web
          name: orion-backend
          envVarKey: ORION_INTERNAL_TOKEN

      # --- Kafka ------------------------------------------------------------
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: PLAIN
      - key: KAFKA_SASL_USERNAME
        sync: false        # Confluent API key
      - key: KAFKA_SASL_PASSWORD
        sync: false        # Confluent API secret

      # --- Models -----------------------------------------------------------
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: OPENAI_CHAT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_EXTRACTION_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: TRANSCRIPTION_PROVIDER
        value: assemblyai
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_MODEL
        value: universal-3-5-pro
      - key: ASSEMBLYAI_FALLBACK_MODEL
        value: universal-2

      # --- Storage ----------------------------------------------------------
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: orion
      - key: S3_REGION
        value: auto

      # --- Postgres for RAG -------------------------------------------------
      # The unprivileged role, same as the backend's tenant pool: this service
      # must stay inside row-level security. Pooled endpoint is correct here —
      # it runs no migrations.
      - key: PG_HOST
        sync: false        # pooled Neon host
      - key: PG_PORT
        value: "5432"
      - key: PG_DATABASE
        value: neondb
      - key: PG_USER
        value: orion_app
      - key: PG_PASSWORD
        sync: false
      - key: PG_SSLMODE
        value: require

  # ---------------------------------------------------------------------------
  # Frontend. The NEXT_PUBLIC_* values are consumed at BUILD time — Render
  # exposes service env vars to the Docker build as build args, which is what
  # frontend/Dockerfile declares. Changing one of these requires a rebuild, not
  # just a restart: a redeploy that only restarts keeps the old bundle.
  # ---------------------------------------------------------------------------
  - type: web
    name: orion-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # By hand, for the third time and the same reason: `property: host` has
      # no scheme, and this one is INLINED INTO THE BROWSER BUNDLE at build
      # time. A scheme-less value there becomes a relative path -- the app
      # would call itself instead of the API, and no amount of restarting
      # fixes it without a rebuild.
      - key: NEXT_PUBLIC_API_URL
        sync: false        # https://orion-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false        # wss://<backend-host>/ws
      - key: NEXT_PUBLIC_AUTH_MODE
        value: clerk
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
