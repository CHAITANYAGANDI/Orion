# Project name drives container/volume/image prefixes. Set explicitly so they
# read `recallix-*` regardless of the folder the repo is checked out into.
name: recallix

services:
  postgres:
    # pgvector image = Postgres 16 + the `vector` extension (for RAG chat).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recallix
      POSTGRES_PASSWORD: recallix
      POSTGRES_DB: recallix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the unprivileged runtime role on a fresh volume. Without it the
      # app would connect as a superuser, and superusers ignore row-level
      # security entirely — see the script for why that matters.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official Apache Kafka image in KRaft mode (single node, no ZooKeeper).
  # NOTE: uses KAFKA_* env vars, not Bitnami's KAFKA_CFG_* convention.
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-node replication settings (defaults of 3 would block topic creation).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the recallix bucket on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/recallix &&
      mc anonymous set none local/recallix;
      exit 0;
      "

  # Catches every outgoing recap email and shows it at http://localhost:8025.
  # Nothing leaves the machine, so the feature is demoable without an SMTP
  # account and a stray test never mails a real person.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  backend-spring:
    build: ./backend-spring
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recallix
      # Runtime: unprivileged, so row-level security binds.
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-recallix_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-recallix_app}
      # System pool: BYPASSRLS, used only for worker callbacks, the outbox
      # relay, Stripe webhooks, share links and provisioning. Routed to by
      # connection, so no statement can grant itself this privilege.
      RECALLIX_DATASOURCE_SYSTEM_USERNAME: ${SYS_DB_USER:-recallix_sys}
      RECALLIX_DATASOURCE_SYSTEM_PASSWORD: ${SYS_DB_PASSWORD:-recallix_sys}
      # Migrations: schema owner.
      FLYWAY_USER: ${FLYWAY_USER:-recallix}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-recallix}
      SPRING_DATA_REDIS_HOST: redis
      # Defaults to the compose broker. Set KAFKA_BOOTSTRAP_SERVERS plus the
      # SASL vars in .env to point local dev at a managed broker instead —
      # worth doing once before a deploy, because credentials that are wrong
      # here fail the same way they would on Render, where the logs are worse.
      # One .env name feeds both services; only the container env differs.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG:-}
      RECALLIX_AUTH_MODE: ${RECALLIX_AUTH_MODE:-dev}
      RECALLIX_INTERNAL_TOKEN: ${RECALLIX_INTERNAL_TOKEN:-dev-internal-token}
      # When the daily action-item digest goes out (six-field cron, UTC).
      # Exposed because it is the one scheduled job that contacts people: an
      # environment that should never mail anybody moves it out of reach or
      # turns mail off entirely with RECALLIX_MAIL_ENABLED.
      RECALLIX_TASKS_REMINDER_CRON: "${RECALLIX_TASKS_REMINDER_CRON:-0 0 8 * * *}"
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      AI_SERVICE_URL: http://ai-service:8000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: recallix
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM:-}
      APP_FRONTEND_URL: http://localhost:3000
      # Mailpit in dev; point these at a real relay to send for real.
      SPRING_MAIL_HOST: ${SMTP_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SMTP_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      RECALLIX_MAIL_FROM: ${MAIL_FROM:-recallix@localhost}
      RECALLIX_MAIL_ENABLED: ${MAIL_ENABLED:-true}

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      SPRING_CALLBACK_URL: http://backend-spring:8080
      RECALLIX_INTERNAL_TOKEN: ${RECALLIX_INTERNAL_TOKEN:-dev-internal-token}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-terra}
      # Structured extraction: smaller model, far more tokens-per-minute
      # headroom, so it stops competing with the summary for the budget.
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-gpt-5.6-luna}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      # Speech-to-text is chosen separately from the LLM: AssemblyAI and
      # Deepgram diarize, Whisper does not.
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-auto}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_MODEL: ${ASSEMBLYAI_MODEL:-universal-3-5-pro}
      ASSEMBLYAI_FALLBACK_MODEL: ${ASSEMBLYAI_FALLBACK_MODEL:-universal-2}
      ASSEMBLYAI_LANGUAGE: ${ASSEMBLYAI_LANGUAGE:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: recallix
      # RAG: direct Postgres access for transcript chunk storage/retrieval.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: recallix
      # Unprivileged, same reason as the backend: a superuser connection would
      # silently ignore every row-level security policy.
      PG_USER: ${APP_DB_USER:-recallix_app}
      PG_PASSWORD: ${APP_DB_PASSWORD:-recallix_app}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Inlined into the client bundle at build time; the runtime block below
      # cannot substitute for these (see frontend/Dockerfile).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend-spring
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: http://localhost:8080/ws
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}

volumes:
  pgdata:
  miniodata:
