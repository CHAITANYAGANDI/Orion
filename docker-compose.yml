# Project name drives container/volume/image prefixes. Set explicitly so they
# read `recallix-*` regardless of the folder the repo is checked out into.
name: recallix

services:
  backend-spring:
    build: ./backend-spring
    ports:
      - "8080:8080"
    environment:
      # Postgres is Neon. The JDBC form of Neon's pooled URL, with
      # `channel_binding` stripped -- that is a libpq parameter the JDBC driver
      # does not understand and rejects.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?set it in .env}
      # Runtime: unprivileged, so row-level security binds.
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-recallix_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-recallix_app}
      # System pool: BYPASSRLS, used only for worker callbacks, the outbox
      # relay, worker callbacks, share links and provisioning. Routed to by
      # connection, so no statement can grant itself this privilege.
      RECALLIX_DATASOURCE_SYSTEM_USERNAME: ${SYS_DB_USER:-recallix_sys}
      RECALLIX_DATASOURCE_SYSTEM_PASSWORD: ${SYS_DB_PASSWORD:-recallix_sys}
      # Migrations: schema owner, and the DIRECT endpoint rather than the
      # pooled one. Flyway holds an advisory lock across several transactions
      # and a transaction-mode pooler does not keep it, so migrating through
      # the pooler can deadlock or half-apply.
      FLYWAY_URL: ${FLYWAY_URL:?set it in .env}
      FLYWAY_USER: ${FLYWAY_USER:-recallix}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-recallix}
      # Defaults to the compose broker. Set KAFKA_BOOTSTRAP_SERVERS plus the
      # SASL vars in .env to point local dev at a managed broker instead —
      # worth doing once before a deploy, because credentials that are wrong
      # here fail the same way they would on Render, where the logs are worse.
      # One .env name feeds both services; only the container env differs.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?set it in .env}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG:-}
      RECALLIX_AUTH_MODE: ${RECALLIX_AUTH_MODE:-dev}
      RECALLIX_INTERNAL_TOKEN: ${RECALLIX_INTERNAL_TOKEN:-dev-internal-token}
      # The nightly retention pass (V35). Exposed for the same reason and one
      # more: it is the only scheduled job that deletes data, so an environment
      # restored from a backup needs to be able to switch it off before it wakes
      # up and re-runs last month's deletions against data somebody is trying to
      # recover.
      RECALLIX_RETENTION_CRON: "${RECALLIX_RETENTION_CRON:-0 0 3 * * *}"
      RECALLIX_RETENTION_ENABLED: "${RECALLIX_RETENTION_ENABLED:-true}"
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      AI_SERVICE_URL: http://ai-service:8000
      # Object storage is Cloudflare R2. No local fallback: a default onto a
      # host that no longer exists fails as a connection timeout rather than
      # as the missing setting it actually is.
      S3_ENDPOINT: ${S3_ENDPOINT:?set it in .env}
      # The same host, unlike under MinIO -- R2's endpoint is reachable from
      # the internet, so a browser can follow a presigned URL straight to it.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set it in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set it in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set it in .env}
      S3_BUCKET: ${S3_BUCKET:-recallix}
      # R2 signs with this and wants `auto`. MinIO ignored it, which is why it
      # was never in this file before.
      S3_REGION: ${S3_REGION:-auto}
      APP_FRONTEND_URL: http://localhost:3000

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?set it in .env}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      SPRING_CALLBACK_URL: http://backend-spring:8080
      RECALLIX_INTERNAL_TOKEN: ${RECALLIX_INTERNAL_TOKEN:-dev-internal-token}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-terra}
      # Structured extraction: smaller model, far more tokens-per-minute
      # headroom, so it stops competing with the summary for the budget.
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-gpt-5.6-luna}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      # Speech-to-text is chosen separately from the LLM: AssemblyAI
      # diarizes, Whisper does not.
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-auto}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_MODEL: ${ASSEMBLYAI_MODEL:-universal-3-5-pro}
      ASSEMBLYAI_FALLBACK_MODEL: ${ASSEMBLYAI_FALLBACK_MODEL:-universal-2}
      ASSEMBLYAI_LANGUAGE: ${ASSEMBLYAI_LANGUAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?set it in .env}
      # Where AssemblyAI fetches a recording from when it fetches one itself,
      # which saves moving the whole file through this service twice. Distinct
      # from S3_ENDPOINT, which is reachable only inside this network: a
      # presigned URL signed against http://minio:9000 is valid and
      # unreachable, which is the most confusing possible failure.
      #
      # R2's endpoint is reachable from the internet, so AssemblyAI can fetch
      # the recording itself and the file stops crossing this service twice.
      # This was blank under MinIO, whose endpoint resolved nowhere useful.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set it in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set it in .env}
      S3_BUCKET: ${S3_BUCKET:-recallix}
      S3_REGION: ${S3_REGION:-auto}
      # RAG: direct Postgres access for transcript chunk storage/retrieval.
      PG_HOST: ${PG_HOST:?set it in .env}
      PG_PORT: "${PG_PORT:-5432}"
      # Neon names its database `neondb`, not `recallix`. Parameterised rather
      # than hardcoded because the failure is a connection error naming a
      # database that was never meant to exist here.
      PG_DATABASE: ${PG_DATABASE:-recallix}
      # Unprivileged, same reason as the backend: a superuser connection would
      # silently ignore every row-level security policy.
      PG_USER: ${APP_DB_USER:-recallix_app}
      PG_PASSWORD: ${APP_DB_PASSWORD:-recallix_app}
      # "prefer" downgrades to plaintext when the server allows it, which the
      # local container does. Neon refuses unencrypted connections outright.
      PG_SSLMODE: ${PG_SSLMODE:-prefer}
      # Encrypts voice templates at rest (V53). Unset means speaker
      # identification is switched off entirely -- no embedding is computed and
      # nothing is stored -- which is the correct failure for a deployment that
      # has not thought about where this key lives.
      #
      # The default below is a DEVELOPMENT key, committed on purpose so the
      # feature works out of the box on a laptop. It is public, so treat every
      # profile written with it as public. A real deployment sets
      # SPEAKER_PROFILE_KEY from its own secret store; rotating it does not
      # re-encrypt anything, it orphans the old rows, which are then ignored
      # and recomputed. Generate one with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      SPEAKER_PROFILE_KEY: ${SPEAKER_PROFILE_KEY:-zTCIlJAzhDnULzS5z_IBhDcx4YQpVWtfRbKX2sVVNpI=}

  frontend:
    build:
      context: ./frontend
      # Inlined into the client bundle at build time; the runtime block below
      # cannot substitute for these (see frontend/Dockerfile).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        # `git rev-parse --short HEAD` from your shell, or nothing — the footer
        # says "dev build" when it is absent rather than showing a fake hash.
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
        NEXT_PUBLIC_BUILD_SHA: ${NEXT_PUBLIC_BUILD_SHA:-}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend-spring
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: http://localhost:8080/ws
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}

