[project]
name = "reverie-ai-service"
version = "0.1.0"
description = "Reverie AI — FastAPI AI worker (transcription, summarization, extraction)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiokafka>=0.11",
    "httpx>=0.27",
    "openai>=1.35",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "psycopg[binary,pool]>=3.2",
]

# No speaker embedding extra. There was one -- `voiceprints`, carrying torch,
# torchaudio, speechbrain and numpy for a local ECAPA-TDNN model -- and it was
# removed with the feature it served. Nothing in this service loads an acoustic
# model any more; see docs/speaker-identification.md for what was measured and
# why it went.
[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
